[package]
name = "incredible-squaring"
version.workspace = true
edition.workspace = true
authors.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
license-file.workspace = true

[dependencies]
alloy = { version = "0.13", features = [
    "sol-types",
    "contract",
    "full",
    "signer-aws",
    "rlp",
    "json-rpc",
    "signer-keystore",
] }
eigensdk = { workspace = true, features = ["full"] }
eyre.workspace = true
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.41", features = ["test-util", "full", "sync"] }
toml = "0.8"
tracing.workspace = true

[lib]
doctest = false

[[bin]]
name = "incredible-squaring-aggregator"
path = "src/bin/aggregator.rs"

[[bin]]
name = "incredible-squaring-operator"
path = "src/bin/operator.rs"

[[bin]]
name = "incredible-squaring-task-spammer"
path = "src/bin/task_spammer.rs"

[[bin]]
name = "incredible-squaring-challenger"
path = "src/bin/challenger.rs"
