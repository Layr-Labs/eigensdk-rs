[package]
name = "eigen-metrics-collectors-economic"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "eigenlayer economic metrics"
license-file.workspace = true

# docs.rs-specific configuration
# see https://docs.rs/about/metadata
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
alloy.workspace = true
eigen-types.workspace = true
eigen-client-elcontracts.workspace = true
eigen-client-avsregistry.workspace = true
thiserror.workspace = true
tracing.workspace = true
metrics.workspace = true
num-bigint.workspace = true

[dev-dependencies]
# We don't use workspace due to:
# https://github.com/rust-lang/cargo/issues/4242#issuecomment-2578428685
eigen-testing-utils = { path = "../../../../tests/testing-utils" }

tokio.workspace = true
